[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Permite acesso à tela legada/backup sincronizada
[[redirects]]
  from = "/backup-painel"
  to = "/backup-painel.html"
  status = 200

# Redirecionamento padrão para a SPA do React (src/App.tsx)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
